# Opens PRs for vulnerable or outdated dependencies (docs/SECURITY.md).
# Minor/patch npm updates are grouped into one weekly PR to keep noise down;
# security updates arrive as their own PRs as soon as an advisory is published
# (enable "Dependabot security updates" in the repo's Settings → Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
