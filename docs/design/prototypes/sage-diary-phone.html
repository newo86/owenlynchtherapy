<title>Sage Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized app, centred on a calm ground on desktop, full screen on phones.
   Sage header with the split-circle art, light sage page, one yellow action per screen. */
:root {
  --ground: #DDE7E0;        /* behind the phone on desktop */
  --page: #EEF3EF;          /* app background */
  --card: #FAFCFA;
  --header: #4F8A68;        /* website sage */
  --rail: #2F5A44;          /* deep sage for the tab bar */
  --on-header: #FFFFFF;
  --ink: #1F2B24;
  --ink-soft: #4B5A51;
  --pill: #DCE8E0;
  --line: #E1E9E3;
  --action: #F6CB52;        /* softened af Klint yellow */
  --on-action: #1F2B24;
  --danger: #B3261E;
  --danger-soft: #F8E3E1;
  --art-blue: #AFC3DE;
  --art-yellow: #FBB807;
  --art-cream: #FAF6EC;
  --art-dot: #A8C8B5;
  --scrim: rgba(20, 32, 26, .34);
  --shadow: 0 1px 2px rgba(31, 43, 36, .06), 0 8px 24px rgba(31, 43, 36, .08);
  --font: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rail: #16241C; --ground: #0D1310; --page: #121A16; --card: #1A2620; --header: #2F5A44; --on-header: #FFFFFF;
    --ink: #EAF1EC; --ink-soft: #A9BBB0; --pill: #26382E; --line: #24332B;
    --action: #F6CB52; --on-action: #1F2B24; --danger: #F2B8B5; --danger-soft: #3A2120;
    --art-cream: #EDE7D8; --art-dot: #7FB096; --scrim: rgba(0,0,0,.5);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --rail: #16241C; --ground: #0D1310; --page: #121A16; --card: #1A2620; --header: #2F5A44; --on-header: #FFFFFF;
  --ink: #EAF1EC; --ink-soft: #A9BBB0; --pill: #26382E; --line: #24332B;
  --action: #F6CB52; --on-action: #1F2B24; --danger: #F2B8B5; --danger-soft: #3A2120;
  --art-cream: #EDE7D8; --art-dot: #7FB096; --scrim: rgba(0,0,0,.5);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.phone {
  position: relative; width: 100%; max-width: 393px; height: min(852px, 100%);
  background: var(--page); border-radius: 44px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
@media (max-width: 500px) {
  body { padding: 0; }
  .phone { max-width: none; height: 100%; border-radius: 0; box-shadow: none; }
}

/* ── Screens ─────────────────────────────────────────── */
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 170px; }
.screen[hidden] { display: none !important; }

.head { position: relative; height: 236px; }
.head svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.head h1 { position: absolute; left: 22px; top: 112px; margin: 0; font-size: 34px; font-weight: 700; color: var(--on-header); letter-spacing: -.01em; }
.head .sub { position: absolute; left: 22px; top: 158px; font-size: 19px; font-weight: 600; color: var(--on-header); }

.content { padding: 8px 18px 0; display: flex; flex-direction: column; gap: 24px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group-title { margin: 0 2px; font-size: 15px; font-weight: 700; }
.hint { margin: 0 2px; font-size: 14px; color: var(--ink-soft); }

.card { background: var(--card); border-radius: 18px; overflow: hidden; }

/* Swipeable session rows */
.row-wrap { position: relative; overflow: hidden; }
.row-wrap + .row-wrap { border-top: 1px solid var(--line); }
.row-actions { position: absolute; inset: 0 0 0 auto; display: flex; }
.row-actions button {
  width: 76px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--pill); color: var(--ink);
}
.row-actions button svg { width: 20px; height: 20px; }
.row-actions .is-paid { background: #CFE3D6; }
.row-actions .is-delete { background: var(--danger-soft); color: var(--danger); }
:root[data-theme="dark"] .row-actions .is-paid { background: #2C4A3A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .row-actions .is-paid { background: #2C4A3A; } }

.row {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px;
  padding: 12px 14px; border: 0; background: var(--card); text-align: left; cursor: pointer;
  touch-action: pan-y; transition: transform 220ms cubic-bezier(.22,1,.36,1); user-select: none;
}
.row.dragging { transition: none; }
.row .t { width: 48px; flex: none; font-size: 15px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.row .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.row .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 14px; color: var(--ink-soft); }
.tag { flex: none; font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--pill); white-space: nowrap; }
.tag.paid { background: #CFE3D6; }
:root[data-theme="dark"] .tag.paid { background: #2C4A3A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.paid { background: #2C4A3A; } }

.empty { padding: 18px 14px; color: var(--ink-soft); margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid transparent; background: var(--card); border-radius: 999px; padding: 9px 14px;
  font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px; font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { background: var(--pill); border-color: var(--ink); }

/* The one yellow action, above the tab bar */
.main-action {
  position: absolute; left: 18px; right: 18px; bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  height: 56px; border: 0; border-radius: 18px; background: var(--action); color: var(--on-action);
  font-size: 17px; font-weight: 700; cursor: pointer; z-index: 5;
}
.main-action:active { transform: scale(.98); }

/* Tab bar */
.tabs {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--rail); border-top: 0;
  display: flex; justify-content: space-around; padding: 8px 12px calc(14px + env(safe-area-inset-bottom, 0px));
}
.tab {
  border: 0; background: transparent; min-width: 72px; min-height: 52px; border-radius: 14px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; font-weight: 500; color: var(--ink-soft);
}
.tab svg { width: 22px; height: 22px; }
.tab { color: #DDE9E1; transition: color 150ms, background 150ms; }
.tab:hover { color: var(--action); }
.tab[aria-current="page"] { background: rgba(255,255,255,.12); color: var(--action); font-weight: 700; }

/* Calendar */
.month-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px; }
.month-head h2 { margin: 0; font-size: 20px; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--card); cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 6px; gap: 2px 0; text-align: center; }
.wd { font-size: 12px; color: var(--ink-soft); padding-bottom: 6px; }
.day { border: 0; background: transparent; cursor: pointer; min-height: 46px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 4px; border-radius: 12px; }
.day .n { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; font-size: 15px; font-variant-numeric: tabular-nums; }
.day.out .n { color: var(--ink-soft); opacity: .5; }
.day.today .n { box-shadow: inset 0 0 0 1.5px var(--ink); }
.day[aria-pressed="true"] .n { background: var(--pill); font-weight: 700; }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; }

/* Plain lists (Clients, More) */
.list-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 56px; }
.list-row + .list-row { border-top: 1px solid var(--line); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .soft { color: var(--ink-soft); font-size: 15px; }
.search { width: 100%; min-height: 48px; border: 0; border-radius: 14px; padding: 0 14px; background: var(--card); color: var(--ink); font: inherit; font-size: 16px; }

/* ── Full-screen modal ───────────────────────────────── */
.modal { position: absolute; inset: 0; z-index: 20; background: var(--page); display: flex; flex-direction: column; transform: translateY(100%); transition: transform 260ms cubic-bezier(.22,1,.36,1); visibility: hidden; }
.modal.open { transform: none; visibility: visible; }
.modal-head { background: var(--header); color: var(--on-header); padding: 54px 20px 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-head h2 { margin: 0; font-size: 26px; font-weight: 700; }
.modal-head p { margin: 4px 0 0; font-size: 17px; font-weight: 600; }
.close { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.18); color: var(--on-header); cursor: pointer; display: grid; place-items: center; flex: none; }
.close svg { width: 22px; height: 22px; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 14px; }

.opt { background: var(--card); border-radius: 18px; overflow: hidden; }
.opt-head { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; padding: 16px; min-height: 64px; cursor: pointer; text-align: left; }
.opt-head .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--pill); display: grid; place-items: center; flex: none; }
.opt-head .ic svg { width: 20px; height: 20px; }
.opt-head .txt { flex: 1; display: flex; flex-direction: column; }
.opt-head .txt b { font-size: 17px; }
.opt-head .txt span { font-size: 14px; color: var(--ink-soft); }
.opt-head .chev { width: 18px; height: 18px; color: var(--ink-soft); transition: transform 200ms; }
.opt.open .opt-head .chev { transform: rotate(90deg); }
.opt.is-danger .ic { background: var(--danger-soft); color: var(--danger); }
.opt.is-danger .opt-head .txt b { color: var(--danger); }
.opt-panel { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.opt-panel[hidden] { display: none !important; }
.opt-panel .label { font-size: 14px; color: var(--ink-soft); margin: 0; }
.seg { display: flex; background: var(--page); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--pill); font-weight: 700; }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--header); }
.do { min-height: 52px; border: 0; border-radius: 16px; background: var(--action); color: var(--on-action); font-size: 17px; font-weight: 700; cursor: pointer; }
.do.danger { background: var(--danger); color: #FFFFFF; }
:root[data-theme="dark"] .do.danger { color: #3A2120; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .do.danger { color: #3A2120; } }
.quiet { min-height: 44px; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: 15px; }
.done-note { margin: 0; font-size: 14px; color: var(--ink-soft); }

/* Sub-pages from More and Clients (Money, Forms, Waitlist, Settings, a client) */
.modal-body > * { flex-shrink: 0; }
.page { z-index: 4; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.phone.page-open .main-action { display: none; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 6px; margin: -8px 0 6px -6px; border: 0; border-radius: 12px; background: rgba(255,255,255,.18); color: var(--on-header); font-weight: 600; cursor: pointer; }
.back svg { width: 20px; height: 20px; }
.nav-row { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; }
.nav-row + .nav-row { border-top: 1px solid var(--line); }
.nav-row .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--pill); display: grid; place-items: center; flex: none; }
.nav-row .ic svg { width: 20px; height: 20px; }
.nav-row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nav-row .txt b { font-size: 17px; }
.nav-row .txt span { font-size: 14px; color: var(--ink-soft); }
.nav-row .chev { width: 18px; height: 18px; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); }
.section-title { margin: 6px 2px 0; font-size: 15px; font-weight: 700; }
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.small-btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--pill); color: var(--ink); font-weight: 600; cursor: pointer; }
.small-btn.yellow { background: var(--action); color: var(--on-action); }
.bar { height: 8px; border-radius: 4px; background: var(--pill); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--header); border-radius: 4px; }
.chart { width: 100%; height: 120px; }
.money-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; }
.money-row + .money-row { border-top: 1px solid var(--line); }
.money-row .grow { flex: 1; min-width: 0; }
.money-row .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.money-row .soft { font-size: 14px; color: var(--ink-soft); }


/* Hover and press on light rows: soft yellow, icon tile full yellow (text stays dark to stay readable) */
.nav-row, .opt-head, .row { transition: background 150ms; }
.nav-row:hover, .nav-row:focus-visible, .nav-row:active,
.opt-head:hover, .opt-head:focus-visible { background: color-mix(in srgb, var(--action) 24%, var(--card)); }
.nav-row:hover .ic, .nav-row:focus-visible .ic, .nav-row:active .ic,
.opt-head:hover .ic, .opt-head:focus-visible .ic { background: var(--action); color: var(--on-action); }
.opt.is-danger .opt-head:hover { background: var(--danger-soft); }
.opt.is-danger .opt-head:hover .ic { background: var(--danger); color: #FFFFFF; }
.row:hover { background: color-mix(in srgb, var(--action) 18%, var(--card)); }

/* Book sheet */
.sheet-scrim { position: absolute; inset: 0; z-index: 15; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 200ms; }
.sheet-scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 16; background: var(--card); border-radius: 26px 26px 0 0; padding: 10px 18px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; transform: translateY(105%); transition: transform 260ms cubic-bezier(.22,1,.36,1); visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sheet h2 { margin: 0; font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.select { min-height: 48px; border: 0; border-radius: 12px; padding: 0 12px; background: var(--page); color: var(--ink); font: inherit; font-size: 16px; }

/* Toast */
.toast { position: absolute; left: 18px; right: 18px; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--page); border-radius: 14px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity 200ms, transform 200ms; pointer-events: none; }
.toast.show { opacity: 1; transform: none; pointer-events: auto; }
.toast span { flex: 1; }
.toast button { min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--action); font-weight: 700; cursor: pointer; }

.example { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; font-size: 12px; font-weight: 600; color: var(--on-header); background: rgba(0,0,0,.18); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}
</style>

<div class="phone" id="app">
  <span class="example">Example data</span>

  <!-- TODAY -->
  <section class="screen" id="s-today" aria-label="Today">
    <div class="head" data-art></div>
    <div class="content">
      <div class="group">
        <div class="card" id="today-list"></div>
        <p class="hint">Swipe a client left for options, or tap them.</p>
      </div>
      <div class="group">
        <h2 class="group-title">Free this week</h2>
        <div class="chips" id="free-chips"></div>
      </div>
    </div>
  </section>

  <!-- CALENDAR -->
  <section class="screen" id="s-calendar" aria-label="Calendar" hidden>
    <div class="head" data-art data-title="Calendar" data-sub="December 2026"></div>
    <div class="content">
      <div class="group">
        <div class="month-head">
          <h2 id="month-title">December 2026</h2>
        </div>
        <div class="card"><div class="grid" id="month-grid"></div></div>
      </div>
      <div class="group">
        <h2 class="group-title" id="day-title"></h2>
        <div class="card" id="day-list"></div>
      </div>
    </div>
  </section>

  <!-- CLIENTS -->
  <section class="screen" id="s-clients" aria-label="Clients" hidden>
    <div class="head" data-art data-title="Clients" data-sub="6 clients"></div>
    <div class="content">
      <label class="group"><span class="hint">Search</span><input class="search" id="client-search" type="search" placeholder="Search clients"></label>
      <div class="card" id="client-list"></div>
    </div>
  </section>

  <!-- MORE -->
  <section class="screen" id="s-more" aria-label="More" hidden>
    <div class="head" data-art data-title="More" data-sub="Settings and help"></div>
    <div class="content" id="more-list"></div>
  </section>

  <button class="main-action" id="main-action" type="button">Book next session</button>

  <nav class="tabs" aria-label="Main">
    <button class="tab" type="button" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button class="tab" type="button" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button class="tab" type="button" data-tab="clients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Clients</button>
    <button class="tab" type="button" data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
  </nav>

  <!-- Session options: full-screen -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-name" aria-hidden="true">
    <div class="modal-head">
      <div>
        <h2 id="m-name"></h2>
        <p id="m-when"></p>
      </div>
      <button class="close" type="button" id="m-close" aria-label="Close and go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>

  <!-- Sub-page: Money, Forms, Waitlist, Settings, Hours, a client -->
  <div class="modal page" id="page" role="dialog" aria-modal="true" aria-labelledby="p-title" aria-hidden="true">
    <div class="modal-head" style="flex-direction:column;align-items:stretch;gap:0">
      <div><button class="back" type="button" id="p-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg><span id="p-back-label">More</span></button></div>
      <h2 id="p-title"></h2>
      <p id="p-sub"></p>
    </div>
    <div class="modal-body" id="p-body"></div>
  </div>

  <!-- Book sheet -->
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheet-title">Book next session</h2>
    <label class="field"><span class="hint">Client</span><select class="select" id="b-client"></select></label>
    <div class="field"><span class="hint">How</span><div class="seg" id="b-how"></div></div>
    <div class="field"><span class="hint">Repeats</span><div class="seg" id="b-rep"></div></div>
    <div class="field"><span class="hint">Time</span><div class="chips" id="b-time"></div></div>
    <button class="do" type="button" id="b-go">Book</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>
</div>

<script>
(() => {
  // ── Example data (fictional clients) ───────────────────
  const CLIENTS = [
    { id: 'a', name: 'Aoife Byrne', dot: 'var(--art-blue)', how: 'In person', rep: 'Every 2 wks', fee: 80 },
    { id: 'b', name: 'Seán Doyle', dot: 'var(--art-yellow)', how: 'In person', rep: 'Every 2 wks', fee: 60 },
    { id: 'c', name: 'Niamh Kelly', dot: 'var(--art-dot)', how: 'Online', rep: 'Weekly', fee: 80 },
    { id: 'd', name: 'Darragh Ryan', dot: 'var(--art-blue)', how: 'In person', rep: 'Every 2 wks', fee: 60 },
    { id: 'e', name: 'Ciara Walsh', dot: 'var(--art-yellow)', how: 'Online', rep: 'Weekly', fee: 80 },
    { id: 'f', name: 'Fionn Murphy', dot: 'var(--art-dot)', how: 'In person', rep: 'Weekly', fee: 80 },
  ];
  const byId = id => CLIENTS.find(c => c.id === id);
  const TODAY = '2026-12-04';                         // a Friday clinic day
  let uid = 0;
  const S = (cid, date, time, extra = {}) => ({ id: 's' + (++uid), cid, date, time, paid: false, formsSent: false, ...extra });
  let sessions = [
    S('a', TODAY, '15:00'), S('b', TODAY, '16:00', { paid: true }), S('c', TODAY, '18:00'),
    S('d', '2026-12-08', '16:00'), S('e', '2026-12-08', '17:00'), S('f', '2026-12-08', '19:00'),
    S('b', '2026-12-11', '15:00'), S('a', '2026-12-11', '16:00'), S('c', '2026-12-11', '18:00'),
    S('d', '2026-12-15', '16:00'), S('e', '2026-12-15', '17:00'), S('f', '2026-12-15', '19:00'),
    S('a', '2026-12-18', '15:00'), S('b', '2026-12-18', '16:00'), S('c', '2026-12-18', '18:00'),
    S('e', '2026-12-22', '17:00'), S('f', '2026-12-22', '19:00'),
  ];
  // Recent paid and unpaid sessions (November) for Money and client pages.
  sessions.push(
    S('a', '2026-11-20', '15:00', { paid: true, method: 'Revolut', done: true }), S('b', '2026-11-20', '16:00', { paid: true, method: 'Cash', done: true }),
    S('c', '2026-11-20', '18:00', { paid: false, done: true }), S('d', '2026-11-24', '16:00', { paid: true, method: 'Revolut', done: true }),
    S('e', '2026-11-24', '17:00', { paid: true, method: 'Card', done: true }), S('f', '2026-11-24', '19:00', { paid: false, done: true }),
    S('c', '2026-11-27', '18:00', { paid: true, method: 'Revolut', done: true }), S('a', '2026-11-06', '15:00', { paid: true, method: 'Revolut', done: true }),
    S('d', '2026-11-10', '16:00', { paid: true, method: 'Cash', done: true }), S('f', '2026-11-17', '19:00', { paid: true, method: 'Revolut', done: true }),
  );
  // Example progress scores (lower is better), oldest first.
  const SCORES = { a: [24, 22, 21, 18, 16, 15], b: [19, 18, 18, 17], c: [28, 27, 25, 24, 21, 20, 18], d: [15, 16, 14], e: [22, 20, 19, 17, 17], f: [26, 25, 23] };
  const FORMS = [
    { id: 'intake', name: 'Intake form', what: 'Contact details, GP, what brings them' },
    { id: 'agree', name: 'Therapeutic agreement', what: 'Fees, cancellations, confidentiality' },
    { id: 'values', name: 'Values questionnaire', what: 'What matters to them, at the start' },
    { id: 'core', name: 'Progress check-in', what: 'Ten short questions, every few sessions' },
    { id: 'ending', name: 'Ending feedback', what: 'For the last session' },
  ];
  const WAITLIST = [
    { name: 'Róisín Brennan', when: 'Joined 3 Nov', wants: 'Online, evenings' },
    { name: 'Conor Healy', when: 'Joined 19 Nov', wants: 'In person, Fridays' },
  ];
  const FREE = [['2026-12-04', '17:00'], ['2026-12-08', '18:00'], ['2026-12-11', '17:00']];

  // ── Helpers ────────────────────────────────────────────
  const $ = s => document.querySelector(s);
  const dateOf = iso => new Date(iso + 'T12:00:00');
  const longDay = iso => dateOf(iso).toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long' });
  const shortDay = iso => dateOf(iso).toLocaleDateString('en-IE', { weekday: 'short', day: 'numeric', month: 'short' });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const icon = {
    move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M10 15h6M14 13l2 2-2 2"/></svg>',
    forms: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    paid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M8 15h3"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    wait: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>',
    hours: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  };

  // Header art: sage band, soft wave edge, one fine line, the split circle.
  const ART = `<svg viewBox="0 0 330 198" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0H330V160C270 190 210 152 150 168C95 182 45 180 0 166Z" fill="var(--header)"/>
    <path d="M-10 66C60 36 110 92 180 60S290 24 340 48" fill="none" stroke="var(--art-cream)" stroke-width="1.4" stroke-opacity=".7"/>
  </svg>
  <svg viewBox="0 0 132 132" style="left:auto;right:14px;top:30px;width:132px;height:132px" aria-hidden="true">
    <g transform="translate(66 66)">
      <circle r="62" fill="var(--art-blue)"/><path d="M0-62A62 62 0 0 1 0 62Z" fill="var(--art-yellow)"/>
      <circle r="36" fill="var(--art-cream)"/><path d="M0-36A36 36 0 0 1 0 36Z" fill="var(--ink)"/>
      <circle r="11" fill="var(--art-dot)"/>
    </g>
  </svg>`;
  document.querySelectorAll('[data-art]').forEach(h => {
    h.innerHTML = ART + `<h1>${esc(h.dataset.title || 'Today')}</h1><div class="sub">${esc(h.dataset.sub || longDay(TODAY))}</div>`;
  });

  // ── Rows with swipe-left actions ───────────────────────
  const ACTIONS = [
    ['move', 'Move', 'reschedule'], ['forms', 'Forms', 'forms'], ['paid', 'Paid', 'paid', 'is-paid'], ['del', 'Delete', 'delete', 'is-delete'],
  ];
  const ACT_W = 76 * ACTIONS.length;
  let openRow = null;

  function rowHTML(s, showDate) {
    const c = byId(s.cid);
    const tags = s.paid ? '<span class="tag paid">Paid</span>' : `<span class="tag">${esc(c.how)}</span>`;
    return `<div class="row-wrap" data-sid="${s.id}">
      <div class="row-actions" aria-hidden="true">
        ${ACTIONS.map(([ic, label, act, cls]) => `<button type="button" tabindex="-1" class="${cls || ''}" data-act="${act}">${icon[ic]}${label}</button>`).join('')}
      </div>
      <button type="button" class="row" aria-label="${esc(c.name)}, ${s.time}. Open options">
        <span class="t">${s.time}</span><span class="dot" style="background:${c.dot}"></span>
        <span class="who"><span class="name">${esc(c.name)}</span>${showDate ? `<span class="meta">${shortDay(s.date)}</span>` : `<span class="meta">${esc(c.rep)} · €${c.fee}</span>`}</span>
        ${tags}
      </button>
    </div>`;
  }

  function closeOpenRow() {
    if (!openRow) return;
    openRow.querySelector('.row').style.transform = '';
    openRow.querySelectorAll('.row-actions button').forEach(b => { b.tabIndex = -1; });
    openRow.querySelector('.row-actions').setAttribute('aria-hidden', 'true');
    openRow = null;
  }
  function setOpen(wrap) {
    closeOpenRow();
    openRow = wrap;
    wrap.querySelector('.row').style.transform = `translateX(-${ACT_W}px)`;
    wrap.querySelectorAll('.row-actions button').forEach(b => { b.tabIndex = 0; });
    wrap.querySelector('.row-actions').setAttribute('aria-hidden', 'false');
  }

  function wireRows(container) {
    container.querySelectorAll('.row-wrap').forEach(wrap => {
      const row = wrap.querySelector('.row');
      let startX = 0, startY = 0, dx = 0, base = 0, dragging = false, moved = false;
      row.addEventListener('pointerdown', e => {
        startX = e.clientX; startY = e.clientY; dx = 0; moved = false; dragging = true;
        base = openRow === wrap ? -ACT_W : 0;
        row.classList.add('dragging');
      });
      row.addEventListener('pointermove', e => {
        if (!dragging) return;
        dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!moved && Math.abs(dx) < 6) return;
        if (!moved && Math.abs(dy) > Math.abs(dx)) { dragging = false; row.classList.remove('dragging'); return; }
        moved = true;
        row.setPointerCapture(e.pointerId);
        const x = Math.max(-ACT_W - 20, Math.min(0, base + dx));
        row.style.transform = `translateX(${x}px)`;
      });
      const end = () => {
        if (!dragging) return;
        dragging = false; row.classList.remove('dragging');
        if (!moved) return;
        const x = base + dx;
        if (x < -ACT_W / 3) setOpen(wrap); else { row.style.transform = ''; if (openRow === wrap) closeOpenRow(); }
      };
      row.addEventListener('pointerup', end);
      row.addEventListener('pointercancel', end);
      row.addEventListener('click', e => {
        if (moved) { e.preventDefault(); moved = false; return; }
        if (openRow === wrap) { closeOpenRow(); return; }
        closeOpenRow();
        openModal(wrap.dataset.sid, null);
      });
      wrap.querySelectorAll('.row-actions button').forEach(b => b.addEventListener('click', () => {
        const sid = wrap.dataset.sid;
        closeOpenRow();
        openModal(sid, b.dataset.act);
      }));
    });
  }
  document.addEventListener('pointerdown', e => { if (openRow && !openRow.contains(e.target)) closeOpenRow(); });

  // ── Today ──────────────────────────────────────────────
  function renderToday() {
    const list = sessions.filter(s => s.date === TODAY).sort((a, b) => a.time.localeCompare(b.time));
    $('#today-list').innerHTML = list.length ? list.map(s => rowHTML(s, false)).join('') : '<p class="empty">No clients today.</p>';
    wireRows($('#today-list'));
    $('#free-chips').innerHTML = FREE.map(([d, t]) => `<button type="button" class="chip" data-d="${d}" data-t="${t}">${shortDay(d).split(' ')[0]} ${t}</button>`).join('');
    $('#free-chips').querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => openSheet(null, ch.dataset.d, ch.dataset.t)));
  }

  // ── Calendar ───────────────────────────────────────────
  let selDay = TODAY;
  function renderCalendar() {
    const g = $('#month-grid');
    const wds = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(w => `<div class="wd" aria-hidden="true">${w}</div>`).join('');
    const first = new Date(2026, 11, 1); const lead = (first.getDay() + 6) % 7;
    let cells = '';
    for (let i = 0; i < 35; i++) {
      const d = new Date(2026, 11, 1 - lead + i);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const out = d.getMonth() !== 11;
      const on = sessions.filter(s => s.date === iso);
      const dots = on.slice(0, 3).map(s => `<i style="background:${byId(s.cid).dot}"></i>`).join('');
      cells += `<button type="button" class="day${out ? ' out' : ''}${iso === TODAY ? ' today' : ''}" data-iso="${iso}" aria-pressed="${iso === selDay}" aria-label="${longDay(iso)}${on.length ? `, ${on.length} sessions` : ''}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
    }
    g.innerHTML = wds + cells;
    g.querySelectorAll('.day').forEach(b => b.addEventListener('click', () => { selDay = b.dataset.iso; renderCalendar(); }));
    $('#day-title').textContent = longDay(selDay);
    const list = sessions.filter(s => s.date === selDay).sort((a, b) => a.time.localeCompare(b.time));
    $('#day-list').innerHTML = list.length ? list.map(s => rowHTML(s, false)).join('') : '<p class="empty">Nothing booked this day.</p>';
    wireRows($('#day-list'));
  }

  // ── Clients & More ─────────────────────────────────────
  function renderClients(q = '') {
    const list = CLIENTS.filter(c => c.name.toLowerCase().includes(q.toLowerCase()));
    $('#client-list').innerHTML = list.map(c => {
      const next = sessions.filter(s => s.cid === c.id && s.date >= TODAY).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
      return `<button type="button" class="nav-row" data-client="${c.id}"><span class="dot" style="width:11px;height:11px;border-radius:50%;background:${c.dot}"></span><span class="txt"><b>${esc(c.name)}</b><span>${next ? `Next: ${shortDay(next.date)}, ${next.time}` : 'Nothing booked'}</span></span><span class="tag">${esc(c.rep)}</span></button>`;
    }).join('') || '<p class="empty">No client by that name.</p>';
    $('#client-list').querySelectorAll('[data-client]').forEach(b => b.addEventListener('click', () => clientPage(b.dataset.client)));
  }
  $('#client-search').addEventListener('input', e => renderClients(e.target.value));
  const navRow = (key, ic, title, sub) => `<button type="button" class="nav-row" data-page="${key}"><span class="ic">${ic}</span><span class="txt"><b>${title}</b><span>${sub}</span></span>${icon.chev}</button>`;
  function renderMore() {
    const m = money();
    $('#more-list').innerHTML = `<div class="card">
      ${navRow('money', icon.paid, 'Money', `€${m.paidMonth} paid this month · ${m.unpaid.length} unpaid`)}
      ${navRow('forms', icon.forms, 'Forms', `${FORMS.length} forms to send or download`)}
      ${navRow('waitlist', icon.wait, 'Waitlist', `${WAITLIST.length} people waiting`)}
      ${navRow('settings', icon.gear, 'Settings', 'Hours, fees, links, calendar')}
    </div>`;
    $('#more-list').querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => PAGES[b.dataset.page]()));
  }
  renderMore();

  // ── Tabs ───────────────────────────────────────────────
  const MAIN = { today: 'Book next session', calendar: 'Book a session', clients: 'Add a client', more: null };
  function show(tab) {
    closeOpenRow(); closePage();
    document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== 's-' + tab; });
    document.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', t.dataset.tab === tab) || t.removeAttribute('aria-current'));
    document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page'); });
    const ma = $('#main-action');
    ma.hidden = !MAIN[tab]; if (MAIN[tab]) ma.textContent = MAIN[tab];
    if (tab === 'calendar') renderCalendar();
    if (tab === 'clients') renderClients($('#client-search').value);
    current = tab;
  }
  let current = 'today';
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
  $('#main-action').addEventListener('click', () => { if (current !== 'clients') openSheet(); else toast('Adding a client is not part of this prototype.'); });

  // ── Toast with undo ────────────────────────────────────
  let undoFn = null, tTimer = null;
  function toast(msg, undo) {
    undoFn = undo || null;
    $('#toast-text').textContent = msg;
    $('#toast-undo').hidden = !undo;
    $('#toast').classList.add('show');
    clearTimeout(tTimer); tTimer = setTimeout(() => $('#toast').classList.remove('show'), 5000);
  }
  $('#toast-undo').addEventListener('click', () => { if (undoFn) undoFn(); $('#toast').classList.remove('show'); refresh(); });

  function refresh() { renderToday(); renderMore(); if (current === 'calendar') renderCalendar(); if (current === 'clients') renderClients($('#client-search').value); if (pageFn && $('#page').classList.contains('open')) { const keep = backTo; pageFn(); backTo = keep; } }
  function snapshot() { return JSON.parse(JSON.stringify(sessions)); }

  // ── Full-screen session options ────────────────────────
  let mSid = null, lastFocus = null;
  function openModal(sid, focusAct) {
    const s = sessions.find(x => x.id === sid); if (!s) return;
    const c = byId(s.cid);
    mSid = sid; lastFocus = document.activeElement;
    $('#m-name').textContent = c.name;
    $('#m-when').textContent = `${longDay(s.date)}, ${s.time} · ${c.how}`;
    const slots = ['2026-12-08T18:00', '2026-12-11T17:00', '2026-12-15T18:00', '2026-12-18T17:00'];
    $('#m-body').innerHTML = `
      <div class="card"><button type="button" class="nav-row" data-client-page="${c.id}"><span class="ic">${icon.chart}</span><span class="txt"><b>${esc(c.name.split(' ')[0])}&rsquo;s page</b><span>Progress, sessions and payments</span></span>${icon.chev}</button></div>
      ${opt('reschedule', icon.move, 'Reschedule', 'Pick a new free time', `
        <p class="label">Free times</p>
        <div class="chips">${slots.map((x, i) => `<button type="button" class="chip" data-slot="${x}" aria-pressed="${i === 0}">${shortDay(x.slice(0, 10))}, ${x.slice(11)}</button>`).join('')}</div>
        <button type="button" class="do" data-go="reschedule">Move to ${shortDay(slots[0].slice(0, 10))}, ${slots[0].slice(11)}</button>`)}
      ${opt('forms', icon.forms, 'Send forms', s.formsSent ? 'Sent today' : 'Intake form, agreement, questionnaire', `
        <label class="check"><input type="checkbox" id="f-intake" checked> Intake form</label>
        <label class="check"><input type="checkbox" id="f-agree" checked> Therapeutic agreement</label>
        <label class="check"><input type="checkbox" id="f-values"> Values questionnaire</label>
        <button type="button" class="do" data-go="forms">Email 2 forms to ${esc(c.name.split(' ')[0])}</button>`)}
      ${opt('paid', icon.paid, s.paid ? 'Paid' : 'Mark as paid', s.paid ? 'Already marked paid' : `€${c.fee} · no receipt is emailed`, s.paid ? `
        <p class="done-note">This session is paid.</p>
        <button type="button" class="quiet" data-go="unpaid">Mark as not paid</button>` : `
        <p class="label">How did they pay?</p>
        <div class="seg" id="pay-how"><button type="button" aria-pressed="true">Revolut</button><button type="button" aria-pressed="false">Cash</button><button type="button" aria-pressed="false">Card</button></div>
        <button type="button" class="do" data-go="paid">Mark €${c.fee} as paid</button>`)}
      ${opt('delete', icon.del, 'Delete session', 'Removes it from your diary', `
        <p class="done-note">Delete ${esc(c.name.split(' ')[0])}&rsquo;s session on ${longDay(s.date)} at ${s.time}? Their other sessions stay.</p>
        <button type="button" class="do danger" data-go="delete">Delete this session</button>`, 'is-danger')}
    `;
    const body = $('#m-body');
    body.querySelector('[data-client-page]').addEventListener('click', () => { closeModal(); clientPage(c.id); });
    body.querySelectorAll('.opt-head').forEach(h => h.addEventListener('click', () => toggleOpt(h.closest('.opt'))));
    body.querySelectorAll('[data-slot]').forEach(ch => ch.addEventListener('click', () => {
      body.querySelectorAll('[data-slot]').forEach(x => x.setAttribute('aria-pressed', String(x === ch)));
      const v = ch.dataset.slot; const go = body.querySelector('[data-go="reschedule"]');
      go.textContent = `Move to ${shortDay(v.slice(0, 10))}, ${v.slice(11)}`;
    }));
    body.querySelectorAll('#pay-how button').forEach(b => b.addEventListener('click', () => body.querySelectorAll('#pay-how button').forEach(x => x.setAttribute('aria-pressed', String(x === b)))));
    const countForms = () => { const n = body.querySelectorAll('.check input:checked').length; const g = body.querySelector('[data-go="forms"]'); g.textContent = n ? `Email ${n} form${n > 1 ? 's' : ''} to ${c.name.split(' ')[0]}` : 'Choose a form'; g.disabled = !n; };
    body.querySelectorAll('.check input').forEach(i => i.addEventListener('change', countForms));
    body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => act(b.dataset.go)));
    if (focusAct) toggleOpt(body.querySelector(`.opt[data-opt="${focusAct}"]`), true);
    const m = $('#modal'); m.classList.add('open'); m.setAttribute('aria-hidden', 'false');
    setTimeout(() => $('#m-close').focus(), 50);
  }
  function opt(key, ic, title, sub, panel, cls = '') {
    return `<div class="opt ${cls}" data-opt="${key}"><button type="button" class="opt-head" aria-expanded="false"><span class="ic">${ic}</span><span class="txt"><b>${title}</b><span>${sub}</span></span>${icon.chev}</button><div class="opt-panel" hidden>${panel}</div></div>`;
  }
  function toggleOpt(o, forceOpen) {
    if (!o) return;
    const willOpen = forceOpen || !o.classList.contains('open');
    document.querySelectorAll('#m-body .opt').forEach(x => { x.classList.remove('open'); x.querySelector('.opt-panel').hidden = true; x.querySelector('.opt-head').setAttribute('aria-expanded', 'false'); });
    if (willOpen) { o.classList.add('open'); o.querySelector('.opt-panel').hidden = false; o.querySelector('.opt-head').setAttribute('aria-expanded', 'true'); }
  }
  function closeModal() {
    const m = $('#modal'); m.classList.remove('open'); m.setAttribute('aria-hidden', 'true');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  $('#m-close').addEventListener('click', closeModal);

  function act(kind) {
    const s = sessions.find(x => x.id === mSid); if (!s) return;
    const c = byId(s.cid); const first = c.name.split(' ')[0];
    const before = snapshot(); const undo = () => { sessions = before; };
    if (kind === 'reschedule') {
      const v = document.querySelector('#m-body [data-slot][aria-pressed="true"]').dataset.slot;
      s.date = v.slice(0, 10); s.time = v.slice(11);
      closeModal(); refresh(); toast(`Moved: ${first} to ${shortDay(s.date)}, ${s.time}`, undo);
    } else if (kind === 'forms') {
      s.formsSent = true; closeModal(); refresh(); toast(`Forms emailed to ${first}`);
    } else if (kind === 'paid') {
      const how = document.querySelector('#pay-how [aria-pressed="true"]').textContent;
      s.paid = true; closeModal(); refresh(); toast(`Marked paid (${how}): ${first}`, undo);
    } else if (kind === 'unpaid') {
      s.paid = false; closeModal(); refresh(); toast(`Marked not paid: ${first}`, undo);
    } else if (kind === 'delete') {
      sessions = sessions.filter(x => x.id !== s.id); closeModal(); refresh(); toast(`Deleted ${first}'s ${s.time} session`, undo);
    }
  }


  // ── Sub-pages ──────────────────────────────────────────
  let pageFn = null;
  function openPage(title, sub, html, backLabel, after) {
    $('#p-title').textContent = title; $('#p-sub').textContent = sub;
    $('#p-back-label').textContent = backLabel || 'More';
    $('#p-body').innerHTML = html;
    if (after) after($('#p-body'));
    const pg = $('#page');
    $('#app').classList.add('page-open');
    if (!pg.classList.contains('open')) { pg.classList.add('open'); pg.setAttribute('aria-hidden', 'false'); setTimeout(() => $('#p-back').focus(), 50); }
    $('#p-body').scrollTop = 0;
  }
  function closePage() { const pg = $('#page'); $('#app').classList.remove('page-open'); pg.classList.remove('open'); pg.setAttribute('aria-hidden', 'true'); pageFn = null; }
  let backTo = null;
  $('#p-back').addEventListener('click', () => { if (backTo) { const f = backTo; backTo = null; f(); } else closePage(); });

  function money() {
    const month = sessions.filter(s => s.date.startsWith('2026-11') || (s.date.startsWith('2026-12') && s.date <= TODAY));
    const fee = s => byId(s.cid).fee;
    const paid = month.filter(s => s.paid);
    const unpaid = sessions.filter(s => !s.paid && s.date <= TODAY).sort((a, b) => a.date.localeCompare(b.date));
    const byMethod = {};
    for (const s of paid) byMethod[s.method || 'Revolut'] = (byMethod[s.method || 'Revolut'] || 0) + fee(s);
    return { paidMonth: paid.reduce((n, s) => n + fee(s), 0), unpaidTotal: unpaid.reduce((n, s) => n + fee(s), 0), unpaid, paid: paid.sort((a, b) => b.date.localeCompare(a.date)), byMethod };
  }

  const PAGES = {
    money() {
      pageFn = PAGES.money; backTo = null;
      const m = money();
      const total = Object.values(m.byMethod).reduce((a, b) => a + b, 0) || 1;
      openPage('Money', 'November and December so far', `
        <div class="stats">
          <div class="stat"><b>€${m.paidMonth}</b><span>Paid</span></div>
          <div class="stat"><b>€${m.unpaidTotal}</b><span>Not paid yet</span></div>
          <div class="stat"><b>${m.paid.length}</b><span>Sessions paid</span></div>
        </div>
        <h3 class="section-title">Not paid yet</h3>
        <div class="card">${m.unpaid.length ? m.unpaid.map(s => `<div class="money-row"><div class="grow"><b>${esc(byId(s.cid).name)}</b><div class="soft">${shortDay(s.date)}, ${s.time}</div></div><span class="amt">€${byId(s.cid).fee}</span><button type="button" class="small-btn" data-pay="${s.id}">Mark paid</button></div>`).join('') : '<p class="empty">Everyone has paid.</p>'}</div>
        <h3 class="section-title">How people paid</h3>
        <div class="card pad">${Object.entries(m.byMethod).map(([k, v]) => `<div><div style="display:flex;justify-content:space-between"><span>${k}</span><b style="font-variant-numeric:tabular-nums">€${v}</b></div><div class="bar"><i style="width:${Math.round(v / total * 100)}%"></i></div></div>`).join('')}</div>
        <h3 class="section-title">Paid recently</h3>
        <div class="card">${m.paid.slice(0, 6).map(s => `<div class="money-row"><div class="grow"><b>${esc(byId(s.cid).name)}</b><div class="soft">${shortDay(s.date)} · ${s.method || 'Revolut'}</div></div><span class="amt">€${byId(s.cid).fee}</span></div>`).join('')}</div>
        <div class="btns"><button type="button" class="small-btn" data-note="statement">Year statement (PDF)</button></div>
      `, 'More', body => {
        body.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.pay, 'paid')));
        body.querySelector('[data-note]').addEventListener('click', () => toast('In the real app this downloads your statement as a PDF.'));
      });
    },
    forms() {
      pageFn = PAGES.forms; backTo = null;
      openPage('Forms', 'Send to a client, or download a PDF', FORMS.map(f => `
        <div class="opt" data-form="${f.id}">
          <div class="pad">
            <div><b style="font-size:17px">${f.name}</b><div class="hint" style="margin:2px 0 0">${f.what}</div></div>
            <div class="btns"><button type="button" class="small-btn" data-send="${f.id}">Send</button><button type="button" class="small-btn" data-pdf="${f.id}">Download PDF</button></div>
            <div class="send-to" hidden>
              <p class="label" style="margin:0 0 8px">Send to</p>
              <div class="chips">${CLIENTS.map((c, i) => `<button type="button" class="chip" data-to="${c.id}" aria-pressed="${i === 0}">${esc(c.name.split(' ')[0])}</button>`).join('')}</div>
              <button type="button" class="do" style="width:100%;margin-top:10px" data-go-send="${f.id}">Email to ${esc(CLIENTS[0].name.split(' ')[0])}</button>
            </div>
          </div>
        </div>`).join(''), 'More', body => {
        body.querySelectorAll('[data-send]').forEach(b => b.addEventListener('click', () => {
          const box = b.closest('.opt').querySelector('.send-to'); box.hidden = !box.hidden;
        }));
        body.querySelectorAll('.opt').forEach(o => o.querySelectorAll('[data-to]').forEach(ch => ch.addEventListener('click', () => {
          o.querySelectorAll('[data-to]').forEach(x => x.setAttribute('aria-pressed', String(x === ch)));
          o.querySelector('[data-go-send]').textContent = `Email to ${byId(ch.dataset.to).name.split(' ')[0]}`;
        })));
        body.querySelectorAll('[data-go-send]').forEach(b => b.addEventListener('click', () => {
          const o = b.closest('.opt'); const to = byId(o.querySelector('[data-to][aria-pressed="true"]').dataset.to);
          const f = FORMS.find(x => x.id === b.dataset.goSend);
          o.querySelector('.send-to').hidden = true; toast(`${f.name} emailed to ${to.name.split(' ')[0]}`);
        }));
        body.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', () => toast('In the real app this downloads the PDF.')));
      });
    },
    waitlist() {
      pageFn = PAGES.waitlist; backTo = null;
      openPage('Waitlist', `${WAITLIST.length} people waiting`, `<div class="card">${WAITLIST.map((w, i) => `<div class="money-row"><div class="grow"><b>${esc(w.name)}</b><div class="soft">${w.when} · ${w.wants}</div></div><button type="button" class="small-btn" data-offer="${i}">Offer a time</button></div>`).join('')}</div>
        <p class="hint">Offering a time emails them your free slots.</p>`, 'More', body => {
        body.querySelectorAll('[data-offer]').forEach(b => b.addEventListener('click', () => toast(`Free times emailed to ${WAITLIST[b.dataset.offer].name.split(' ')[0]}`)));
      });
    },
    settings() {
      pageFn = PAGES.settings; backTo = null;
      openPage('Settings', 'Your practice', `
        <div class="card">${navRow('hours', icon.hours, 'Accreditation hours', '395 of 500 client hours')}</div>
        ${[[['Working hours', 'Tue 4–8pm, Fri 3–7pm'], ['Fees', '€80, low cost €60'], ['Fridays in person', '124 Baggot Street Lower'], ['Payment link', 'Revolut'], ['Video link', 'Google Meet']],
           [['Google Calendar', 'Connected, leads the diary'], ['Reminders', 'Morning of the session'], ['Privacy mode', 'Off'], ['Two-factor sign-in', 'On']]]
          .map(g => `<div class="card">${g.map(([a, b]) => `<div class="list-row"><span class="grow">${a}</span><span class="soft">${b}</span></div>`).join('')}</div>`).join('')}`, 'More', body => {
        body.querySelector('[data-page="hours"]').addEventListener('click', () => PAGES.hours());
      });
    },
    hours() {
      pageFn = PAGES.hours; backTo = PAGES.settings;
      const rows = [['Client hours', 395, 500], ['Supervision', 48, 50], ['Own therapy', 12, 20], ['CPD (this year)', 14, 20]];
      openPage('Accreditation hours', 'Towards your target', `<div class="card pad">${rows.map(([n, v, t]) => `<div><div style="display:flex;justify-content:space-between"><span>${n}</span><b style="font-variant-numeric:tabular-nums">${v} / ${t}</b></div><div class="bar"><i style="width:${Math.min(100, Math.round(v / t * 100))}%"></i></div></div>`).join('')}</div>
        <p class="hint">Client hours count by themselves from attended sessions.</p>`, 'Settings');
    },
  };

  function clientPage(cid) {
    const c = byId(cid);
    pageFn = () => clientPage(cid); backTo = null;
    const mine = sessions.filter(s => s.cid === cid);
    const upcoming = mine.filter(s => s.date >= TODAY).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const past = mine.filter(s => s.date < TODAY);
    const owed = mine.filter(s => !s.paid && s.date <= TODAY);
    const sc = SCORES[cid] || [];
    const hi = Math.max(...sc, 1) + 3, lo = Math.max(0, Math.min(...sc, hi) - 3), w = 300, h = 110, step = sc.length > 1 ? w / (sc.length - 1) : 0;
    const pts = sc.map((v, i) => `${(i * step).toFixed(1)},${(h - (v - lo) / (hi - lo) * h).toFixed(1)}`).join(' ');
    const chart = sc.length ? `<svg class="chart" viewBox="-6 -6 ${w + 12} ${h + 12}" role="img" aria-label="Progress scores from ${sc[0]} to ${sc[sc.length - 1]}, lower is better">
        <polyline points="${pts}" fill="none" stroke="var(--header)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${sc.map((v, i) => `<circle cx="${(i * step).toFixed(1)}" cy="${(h - (v - lo) / (hi - lo) * h).toFixed(1)}" r="${i === sc.length - 1 ? 5 : 3}" fill="${i === sc.length - 1 ? 'var(--art-yellow)' : 'var(--header)'}"/>`).join('')}
      </svg>` : '';
    openPage(c.name, `${c.rep} · ${c.how} · €${c.fee}`, `
      <div class="stats">
        <div class="stat"><b>${past.length + 8}</b><span>Sessions so far</span></div>
        <div class="stat"><b>${upcoming.length}</b><span>Booked ahead</span></div>
        <div class="stat"><b>€${owed.length * c.fee}</b><span>Not paid</span></div>
      </div>
      <h3 class="section-title">Progress check-ins</h3>
      <div class="card pad">${chart}<p class="hint" style="margin:0">${sc.length ? `From ${sc[0]} to ${sc[sc.length - 1]} over ${sc.length} check-ins. Lower is better.` : 'No check-ins yet.'}</p></div>
      <h3 class="section-title">Coming up</h3>
      <div class="card" id="client-upcoming">${upcoming.length ? upcoming.slice(0, 5).map(s => rowHTML(s, true)).join('') : '<p class="empty">Nothing booked.</p>'}</div>
      <div class="btns"><button type="button" class="small-btn yellow" data-book>Book next session</button><button type="button" class="small-btn" data-forms>Send forms</button></div>
    `, current === 'clients' ? 'Clients' : 'Back', body => {
      wireRows(body.querySelector('#client-upcoming'));
      body.querySelector('[data-book]').addEventListener('click', () => openSheet(cid));
      body.querySelector('[data-forms]').addEventListener('click', () => { backTo = () => clientPage(cid); PAGES.forms(); backTo = () => clientPage(cid); $('#p-back-label').textContent = c.name.split(' ')[0]; });
    });
  }

  // ── Book sheet ─────────────────────────────────────────
  const HOW = ['In person', 'Online'], REP = ['Once', 'Weekly', 'Every 2 wks'];
  let bHow = 'In person', bRep = 'Every 2 wks', bSlot = FREE[0];
  function segHTML(el, opts, val, set) {
    el.innerHTML = opts.map(o => `<button type="button" aria-pressed="${o === val}">${o}</button>`).join('');
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { set(b.textContent); el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); updateGo(); }));
  }
  function updateGo() {
    const n = bRep === 'Once' ? 1 : bRep === 'Weekly' ? 12 : 6;
    $('#b-go').textContent = n === 1 ? `Book ${shortDay(bSlot[0])}, ${bSlot[1]}` : `Book ${n} sessions from ${shortDay(bSlot[0])}`;
  }
  function openSheet(cid, d, t) {
    $('#b-client').innerHTML = CLIENTS.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    const pre = cid || sessions.filter(s => s.date === TODAY).sort((a, b) => b.time.localeCompare(a.time)).find(s => s.time <= '18:00')?.cid || 'a';
    $('#b-client').value = pre;
    const c = byId(pre); bHow = c.how; bRep = c.rep;
    bSlot = d ? [d, t] : FREE[0];
    segHTML($('#b-how'), HOW, bHow, v => { bHow = v; });
    segHTML($('#b-rep'), REP, bRep, v => { bRep = v; });
    $('#b-time').innerHTML = FREE.map(([dd, tt]) => `<button type="button" class="chip" data-d="${dd}" data-t="${tt}" aria-pressed="${dd === bSlot[0] && tt === bSlot[1]}">${shortDay(dd)}, ${tt}</button>`).join('');
    $('#b-time').querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => { bSlot = [ch.dataset.d, ch.dataset.t]; $('#b-time').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === ch))); updateGo(); }));
    updateGo();
    $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#sheet-scrim').classList.add('open');
    setTimeout(() => $('#b-client').focus(), 50);
  }
  function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); $('#sheet-scrim').classList.remove('open'); }
  $('#sheet-scrim').addEventListener('click', closeSheet);
  $('#b-client').addEventListener('change', e => { const c = byId(e.target.value); bHow = c.how; bRep = c.rep; segHTML($('#b-how'), HOW, bHow, v => { bHow = v; }); segHTML($('#b-rep'), REP, bRep, v => { bRep = v; }); updateGo(); });
  $('#b-go').addEventListener('click', () => {
    const before = snapshot(); const cid = $('#b-client').value; const c = byId(cid);
    const step = bRep === 'Once' ? 0 : bRep === 'Weekly' ? 7 : 14; const n = step ? (step === 7 ? 12 : 6) : 1;
    for (let i = 0; i < n; i++) { const d = dateOf(bSlot[0]); d.setDate(d.getDate() + step * i); const iso = d.toISOString().slice(0, 10); sessions.push(S(cid, iso, bSlot[1])); }
    closeSheet(); refresh();
    toast(`Booked: ${c.name.split(' ')[0]}, ${bRep === 'Once' ? 'once' : bRep.toLowerCase().replace('wks', 'weeks')} from ${shortDay(bSlot[0])}`, () => { sessions = before; });
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#modal').classList.contains('open')) closeModal();
    else if ($('#sheet').classList.contains('open')) closeSheet();
    else if ($('#page').classList.contains('open')) $('#p-back').click();
    else closeOpenRow();
  });

  renderToday();

  // A one-time peek so the swipe is discoverable (skipped with reduced motion).
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setTimeout(() => {
      const r = document.querySelector('#today-list .row'); if (!r) return;
      r.style.transform = 'translateX(-88px)';
      setTimeout(() => { if (!openRow) r.style.transform = ''; }, 900);
    }, 700);
  }
})();
</script>
