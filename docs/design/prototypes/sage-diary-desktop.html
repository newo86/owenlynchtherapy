<title>Sage Diary Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sage rail on the left (every section, no "More" on a big screen), a sage header band
   with the split circle, two columns below. A session opens in a panel on the right instead of
   a full-screen page, so the diary stays in view. Same tokens as the phone prototype. */
:root {
  --page: #EEF3EF; --card: #FAFCFA; --header: #4F8A68; --rail: #2F5A44; --on-header: #FFFFFF;
  --ink: #1F2B24; --ink-soft: #4B5A51; --pill: #DCE8E0; --line: #E1E9E3;
  --action: #F6CB52; --on-action: #1F2B24; --danger: #B3261E; --danger-soft: #F8E3E1; --paid: #CFE3D6;
  --art-blue: #AFC3DE; --art-yellow: #FBB807; --art-cream: #FAF6EC; --art-dot: #A8C8B5;
  --scrim: rgba(20, 32, 26, .28);
  --font: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #121A16; --card: #1A2620; --header: #2F5A44; --rail: #16241C; --on-header: #FFFFFF;
    --ink: #EAF1EC; --ink-soft: #A9BBB0; --pill: #26382E; --line: #24332B;
    --danger: #F2B8B5; --danger-soft: #3A2120; --paid: #2C4A3A; --art-cream: #EDE7D8; --art-dot: #7FB096;
    --scrim: rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #121A16; --card: #1A2620; --header: #2F5A44; --rail: #16241C; --on-header: #FFFFFF;
  --ink: #EAF1EC; --ink-soft: #A9BBB0; --pill: #26382E; --line: #24332B;
  --danger: #F2B8B5; --danger-soft: #3A2120; --paid: #2C4A3A; --art-cream: #EDE7D8; --art-dot: #7FB096;
  --scrim: rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 96px 1fr; min-height: 100%; }
.rail { background: var(--rail); color: #DDE9E1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 8px; position: sticky; top: 0; height: 100vh; }
.rail .logo { width: 44px; height: 44px; margin-bottom: 14px; }
.rail button { width: 80px; min-height: 60px; border: 0; border-radius: 14px; background: transparent; color: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; }
.rail button svg { width: 22px; height: 22px; }
.rail button { transition: color 150ms, background 150ms; }
.rail button:hover { background: rgba(255,255,255,.08); color: var(--action); }
.rail button[aria-current="page"] { background: rgba(255,255,255,.12); color: var(--action); font-weight: 700; }
.rail .spacer { flex: 1; }

main { min-width: 0; }
.band { position: relative; height: 210px; overflow: hidden; }
.band svg.wave { position: absolute; inset: 0; width: 100%; height: 100%; }
.band .circle { position: absolute; right: 56px; top: 22px; width: 150px; height: 150px; }
.band-inner { position: relative; height: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 44px 240px 0 48px; }
.band h1 { margin: 0; font-size: 40px; font-weight: 700; color: var(--on-header); letter-spacing: -.01em; }
.band .sub { margin-top: 4px; font-size: 19px; font-weight: 600; color: var(--on-header); }
.cta { min-height: 52px; padding: 0 26px; border: 0; border-radius: 16px; background: var(--action); color: var(--on-action); font-size: 17px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.cta:active { transform: scale(.98); }

.wrap { padding: 8px 48px 56px; max-width: 1240px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 28px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } .band-inner { padding-right: 200px; } }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
.h { margin: 0 2px; font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
.h small { font-weight: 500; color: var(--ink-soft); font-size: 14px; }
.card { background: var(--card); border-radius: 18px; overflow: hidden; }
.pad { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.hint { margin: 0 2px; font-size: 14px; color: var(--ink-soft); }

/* Session rows: hover shows quick actions (no swipe on a mouse) */
.srow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 68px; cursor: pointer; position: relative; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow:hover, .srow.is-sel { background: color-mix(in srgb, var(--action) 20%, var(--card)); }
.srow .t { width: 52px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.srow .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srow .name { font-weight: 600; }
.srow .meta { font-size: 14px; color: var(--ink-soft); }
.tag { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--pill); white-space: nowrap; }
.tag.paid { background: var(--paid); }
.quick { display: flex; gap: 4px; opacity: 0; transition: opacity 150ms; }
.srow:hover .quick, .srow:focus-within .quick, .srow.is-sel .quick { opacity: 1; }
.qbtn { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--card); cursor: pointer; display: grid; place-items: center; }
.qbtn svg { width: 18px; height: 18px; }
.qbtn.del { color: var(--danger); }
.qbtn:hover { background: var(--action); color: var(--on-action); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid transparent; background: var(--card); border-radius: 999px; padding: 9px 14px; min-height: 44px; font-size: 15px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--pill); border-color: var(--ink); }

/* Week strip on the right */
.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.wday { background: var(--card); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.wday b { font-size: 13px; }
.wday.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.wslot { font-size: 12px; border-radius: 8px; padding: 4px 6px; background: var(--pill); line-height: 1.25; }
.wslot.free { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-soft); }

.notice { display: flex; gap: 12px; align-items: flex-start; }
.notice .ndot { width: 10px; height: 10px; border-radius: 50%; background: var(--art-yellow); margin-top: 6px; flex: none; }

/* Month */
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.mwd { font-size: 13px; color: var(--ink-soft); padding: 0 6px; }
.mday { min-height: 104px; background: var(--card); border: 0; border-radius: 14px; padding: 8px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.mday .n { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mday.out { opacity: .45; }
.mday.today .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink); }
.mday[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--header); }
.mev { font-size: 12px; display: flex; gap: 5px; align-items: center; white-space: nowrap; overflow: hidden; }
.mev i { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* Lists and tables */
.lrow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 60px; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .soft { color: var(--ink-soft); font-size: 14px; }
.lrow.click { cursor: pointer; } .lrow.click:hover, .lrow.is-sel { background: color-mix(in srgb, var(--action) 20%, var(--card)); }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--pill); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.yellow { background: var(--action); color: var(--on-action); }
.btn.danger { background: var(--danger); color: #FFF; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--card); border-radius: 16px; padding: 14px 16px; }
.stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-soft); }
.bar { height: 8px; border-radius: 4px; background: var(--pill); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--header); }
.search { width: 100%; min-height: 48px; border: 0; border-radius: 14px; padding: 0 14px; background: var(--card); color: var(--ink); font: inherit; }
.chart { width: 100%; height: 140px; }

/* Session panel (right side) */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 200ms; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--page); z-index: 21; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 260ms cubic-bezier(.22,1,.36,1); visibility: hidden; box-shadow: -12px 0 40px rgba(0,0,0,.12); }
.panel.open { transform: none; visibility: visible; }
.panel-head { background: var(--header); color: var(--on-header); padding: 28px 24px 22px; display: flex; justify-content: space-between; gap: 12px; }
.panel-head h2 { margin: 0; font-size: 26px; }
.panel-head p { margin: 4px 0 0; font-weight: 600; }
.close { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.18); color: var(--on-header); cursor: pointer; display: grid; place-items: center; flex: none; }
.close svg { width: 22px; height: 22px; }
.panel-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.opt { background: var(--card); border-radius: 16px; overflow: hidden; flex-shrink: 0; }
.opt-head { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 60px; cursor: pointer; text-align: left; }
.opt-head .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--pill); display: grid; place-items: center; flex: none; }
.opt-head .ic svg { width: 19px; height: 19px; }
.opt-head .txt { flex: 1; display: flex; flex-direction: column; }
.opt-head .txt span { font-size: 14px; color: var(--ink-soft); }
.opt-head:hover { background: color-mix(in srgb, var(--action) 22%, var(--card)); }
.opt-head:hover .ic { background: var(--action); color: var(--on-action); }
.btn:hover { background: color-mix(in srgb, var(--action) 45%, var(--pill)); }
.opt.is-danger .opt-head:hover { background: var(--danger-soft); } .opt.is-danger .opt-head:hover .ic { background: var(--danger); color: #FFF; }
.opt.is-danger .ic { background: var(--danger-soft); color: var(--danger); } .opt.is-danger b { color: var(--danger); }
.opt-panel { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.opt-panel[hidden] { display: none !important; }
.seg { display: flex; background: var(--page); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--pill); font-weight: 700; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--header); }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 10px); z-index: 40; background: var(--ink); color: var(--page); border-radius: 14px; padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 200ms, transform 200ms; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--action); font-weight: 700; cursor: pointer; }
.example { position: absolute; top: 12px; left: 48px; font-size: 12px; font-weight: 600; color: var(--on-header); background: rgba(0,0,0,.18); padding: 3px 10px; border-radius: 999px; z-index: 2; }

@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; }
  .rail .logo, .rail .spacer { display: none; }
  .band-inner { padding: 40px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); flex-direction: column; }
  .band .circle { width: 110px; height: 110px; right: 12px; }
  .wrap { padding: 8px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .week { grid-template-columns: repeat(2, 1fr); }
  .month { gap: 3px; } .mday { min-height: 60px; } .mev span { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; } }
</style>

<div class="app">
  <nav class="rail" aria-label="Main" id="rail">

  <main>

    wait: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
    move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M10 15h6M14 13l2 2-2 2"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>',
  };
  const NAV = [['today', 'Today', I.today], ['calendar', 'Calendar', I.cal], ['clients', 'Clients', I.people], ['money', 'Money', I.money], ['forms', 'Forms', I.forms], ['waitlist', 'Waitlist', I.wait], ['settings', 'Settings', I.gear]];
  $('#rail').insertAdjacentHTML('beforeend', NAV.map(([k, l, ic], i) => `${i === 6 ? '<div class="spacer"></div>' : ''}<button type="button" data-nav="${k}">${ic}${l}</button>`).join(''));
  $('#rail').querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav)));

  let view = 'today', selCal = TODAY, selClient = 'a';
  function band(title, sub, cta) { $('#b-title').textContent = title; $('#b-sub').textContent = sub; $('#cta').hidden = !cta; if (cta) $('#cta').textContent = cta; }
  $('#cta').addEventListener('click', () => toast('Booking opens the same quick sheet as on the phone.'));

  function srow(s, opts = {}) {
    const c = byId(s.cid);
    return `<div class="srow" data-sid="${s.id}" tabindex="0" role="button" aria-label="${esc(c.name)} ${s.time}, open">
      <span class="t">${s.time}</span><span class="dot" style="background:${c.dot}"></span>
      <span class="who"><span class="name">${esc(c.name)}</span><span class="meta">${opts.date ? shortDay(s.date) : `${c.rep} · €${c.fee}`}</span></span>
      <span class="quick">
        <button type="button" class="qbtn" data-q="reschedule" aria-label="Reschedule">${I.move}</button>
        <button type="button" class="qbtn" data-q="forms" aria-label="Send forms">${I.forms}</button>
        <button type="button" class="qbtn" data-q="paid" aria-label="Mark as paid">${I.money}</button>
        <button type="button" class="qbtn del" data-q="delete" aria-label="Delete">${I.del}</button>
      </span>
      ${s.paid ? '<span class="tag paid">Paid</span>' : `<span class="tag">${esc(c.how)}</span>`}
    </div>`;
  }
  function wire(root) {
    root.querySelectorAll('.srow').forEach(r => {
      r.addEventListener('click', e => { const q = e.target.closest('[data-q]'); openPanel(r.dataset.sid, q ? q.dataset.q : null); });
      r.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === r) openPanel(r.dataset.sid); });
    });
  }

  // ── Views ──────────────────────────────────────────────
  const V = {
    today() {
      band('Today', longDay(TODAY), 'Book next session');
      const list = sessions.filter(s => s.date === TODAY).sort((a, b) => a.time.localeCompare(b.time));
      const days = ['2026-12-01', '2026-12-04', '2026-12-08', '2026-12-11', '2026-12-15'];
      return `<div class="cols">
        <div class="stack">
          <div class="group"><h2 class="h">Today's clients <small>Hover a client for quick actions, or click to open</small></h2>
            <div class="card">${list.map(s => srow(s)).join('') || '<p class="hint" style="padding:16px">No clients today.</p>'}</div></div>
          <div class="group"><h2 class="h">Free this week</h2><div class="chips">${FREE.map(([dd, t]) => `<button type="button" class="chip">${shortDay(dd)}, ${t}</button>`).join('')}</div></div>
        </div>
        <div class="stack">
          <div class="group"><h2 class="h">Needs a decision <small>1</small></h2>
            <div class="card pad"><div class="notice"><span class="ndot"></span><div><b>Niamh Kelly</b> hasn't paid for 20 Nov.<div class="hint" style="margin:2px 0 0">€80 · reminders don't chase payment</div></div></div><div><button type="button" class="btn" data-open-unpaid>Open session</button></div></div></div>
          <div class="group"><h2 class="h">Clinic days <small>Tue and Fri</small></h2>
            <div class="week">${days.map(dd => `<div class="wday${dd === TODAY ? ' today' : ''}"><b>${shortDay(dd)}</b>${sessions.filter(s => s.date === dd).sort((a, b) => a.time.localeCompare(b.time)).map(s => `<span class="wslot">${s.time} ${esc(byId(s.cid).name.split(' ')[0])}</span>`).join('')}${FREE.filter(f => f[0] === dd).map(f => `<span class="wslot free">${f[1]} free</span>`).join('')}</div>`).join('')}</div></div>
        </div>
      </div>`;
    },
    calendar() {
      band('Calendar', 'December 2026', 'Book a session');
      const lead = (new Date(2026, 11, 1).getDay() + 6) % 7; let cells = '';
      for (let i = 0; i < 35; i++) {
        const x = new Date(2026, 11, 1 - lead + i); const iso = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
        const on = sessions.filter(s => s.date === iso).sort((a, b) => a.time.localeCompare(b.time));
        cells += `<button type="button" class="mday${x.getMonth() !== 11 ? ' out' : ''}${iso === TODAY ? ' today' : ''}" data-iso="${iso}" aria-pressed="${iso === selCal}"><span class="n">${x.getDate()}</span>${on.slice(0, 3).map(s => `<span class="mev"><i style="background:${byId(s.cid).dot}"></i><span>${s.time} ${esc(byId(s.cid).name.split(' ')[0])}</span></span>`).join('')}</button>`;
      }
      const list = sessions.filter(s => s.date === selCal).sort((a, b) => a.time.localeCompare(b.time));
      return `<div class="cols">
        <div class="group"><div class="month">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => `<span class="mwd">${w}</span>`).join('')}${cells}</div></div>
        <div class="group"><h2 class="h">${longDay(selCal)}</h2><div class="card">${list.map(s => srow(s)).join('') || '<p class="hint" style="padding:16px">Nothing booked this day.</p>'}</div></div>
      </div>`;
    },
    clients() {
      band('Clients', `${CLIENTS.length} clients`, 'Add a client');
      const c = byId(selClient); const mine = sessions.filter(s => s.cid === c.id);
      const up = mine.filter(s => s.date >= TODAY).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      const owed = mine.filter(s => !s.paid && s.date <= TODAY).length * c.fee;
      const sc = SCORES[c.id]; const hi = Math.max(...sc) + 3, lo = Math.min(...sc) - 3, w = 400, h = 120, st = w / (sc.length - 1);
      const y = v => (h - (v - lo) / (hi - lo) * h).toFixed(1);
      return `<div class="cols" style="grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr)">
        <div class="group"><input class="search" type="search" id="c-search" placeholder="Search clients" aria-label="Search clients">
          <div class="card">${CLIENTS.map(x => `<div class="lrow click${x.id === c.id ? ' is-sel' : ''}" data-cl="${x.id}" tabindex="0" role="button"><span class="dot" style="background:${x.dot}"></span><div class="grow"><b>${esc(x.name)}</b><div class="soft">${x.rep} · ${x.how}</div></div></div>`).join('')}</div></div>
        <div class="stack">
          <div class="group"><h2 class="h" style="font-size:22px">${esc(c.name)} <small>${c.rep} · ${c.how} · €${c.fee}</small></h2>
            <div class="stats"><div class="stat"><b>${mine.filter(s => s.date < TODAY).length + 8}</b><span>Sessions so far</span></div><div class="stat"><b>${up.length}</b><span>Booked ahead</span></div><div class="stat"><b>€${owed}</b><span>Not paid</span></div></div></div>
          <div class="group"><h2 class="h">Progress check-ins <small>Lower is better</small></h2><div class="card pad">
            <svg class="chart" viewBox="-8 -8 ${w + 16} ${h + 16}" role="img" aria-label="Scores from ${sc[0]} to ${sc[sc.length - 1]}"><polyline points="${sc.map((v, i) => `${(i * st).toFixed(1)},${y(v)}`).join(' ')}" fill="none" stroke="var(--header)" stroke-width="2.5" stroke-linejoin="round"/>${sc.map((v, i) => `<circle cx="${(i * st).toFixed(1)}" cy="${y(v)}" r="${i === sc.length - 1 ? 5 : 3}" fill="${i === sc.length - 1 ? 'var(--art-yellow)' : 'var(--header)'}"/>`).join('')}</svg>
            <p class="hint">From ${sc[0]} to ${sc[sc.length - 1]} over ${sc.length} check-ins.</p></div></div>
          <div class="group"><h2 class="h">Coming up</h2><div class="card">${up.slice(0, 4).map(s => srow(s, { date: true })).join('') || '<p class="hint" style="padding:16px">Nothing booked.</p>'}</div></div>
        </div></div>`;
    },
    money() {
      band('Money', 'November and December so far', null);
      const paid = sessions.filter(s => s.paid), unpaid = sessions.filter(s => !s.paid && s.date <= TODAY);
      const sum = a => a.reduce((n, s) => n + byId(s.cid).fee, 0);
      const by = {}; paid.forEach(s => { by[s.method] = (by[s.method] || 0) + byId(s.cid).fee; }); const tot = sum(paid) || 1;
      return `<div class="stack">
        <div class="stats"><div class="stat"><b>€${sum(paid)}</b><span>Paid</span></div><div class="stat"><b>€${sum(unpaid)}</b><span>Not paid yet</span></div><div class="stat"><b>${paid.length}</b><span>Sessions paid</span></div></div>
        <div class="cols">
          <div class="group"><h2 class="h">Not paid yet</h2><div class="card">${unpaid.map(s => `<div class="lrow"><div class="grow"><b>${esc(byId(s.cid).name)}</b><div class="soft">${shortDay(s.date)}, ${s.time}</div></div><span class="amt">€${byId(s.cid).fee}</span><button type="button" class="btn" data-pay="${s.id}">Mark paid</button></div>`).join('') || '<p class="hint" style="padding:16px">Everyone has paid.</p>'}</div></div>
          <div class="stack">
            <div class="group"><h2 class="h">How people paid</h2><div class="card pad">${Object.entries(by).map(([k, v]) => `<div><div style="display:flex;justify-content:space-between"><span>${k}</span><b class="amt">€${v}</b></div><div class="bar"><i style="width:${Math.round(v / tot * 100)}%"></i></div></div>`).join('')}</div></div>
            <div><button type="button" class="btn" data-note>Download year statement (PDF)</button></div>
          </div>
        </div></div>`;
    },
    forms() {
      band('Forms', 'Send to a client, or download a PDF', null);
      return `<div class="card">${FORMS.map(([n, w], i) => `<div class="lrow"><div class="grow"><b>${n}</b><div class="soft">${w}</div></div><button type="button" class="btn" data-send="${i}">Send to a client</button><button type="button" class="btn" data-note>Download PDF</button></div>`).join('')}</div>`;
    },
    waitlist() {
      band('Waitlist', `${WAIT.length} people waiting`, null);
      return `<div class="card">${WAIT.map(([n, j, w]) => `<div class="lrow"><div class="grow"><b>${n}</b><div class="soft">${j} · ${w}</div></div><button type="button" class="btn" data-offer="${n}">Offer a time</button></div>`).join('')}</div>`;
    },
    settings() {
      band('Settings', 'Your practice', null);
      const rows = [['Client hours', 395, 500], ['Supervision', 48, 50], ['Own therapy', 12, 20], ['CPD (this year)', 14, 20]];
      return `<div class="cols">
        <div class="stack">${[[['Working hours', 'Tue 4–8pm, Fri 3–7pm'], ['Fees', '€80, low cost €60'], ['Fridays in person', '124 Baggot Street Lower'], ['Payment link', 'Revolut'], ['Video link', 'Google Meet']], [['Google Calendar', 'Connected, leads the diary'], ['Reminders', 'Morning of the session'], ['Two-factor sign-in', 'On']]].map(g => `<div class="card">${g.map(([a, b]) => `<div class="lrow"><span class="grow">${a}</span><span class="soft">${b}</span></div>`).join('')}</div>`).join('')}</div>
        <div class="group"><h2 class="h">Accreditation hours</h2><div class="card pad">${rows.map(([n, v, t]) => `<div><div style="display:flex;justify-content:space-between"><span>${n}</span><b class="amt">${v} / ${t}</b></div><div class="bar"><i style="width:${Math.min(100, Math.round(v / t * 100))}%"></i></div></div>`).join('')}</div></div>
      </div>`;
    },
  };

  function go(v) {
    view = v;
    document.querySelectorAll('[data-nav]').forEach(b => { if (b.dataset.nav === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#view').innerHTML = V[v]();
    const root = $('#view'); wire(root);
    root.querySelectorAll('[data-iso]').forEach(b => b.addEventListener('click', () => { selCal = b.dataset.iso; go('calendar'); }));
    root.querySelectorAll('[data-cl]').forEach(b => { b.addEventListener('click', () => { selClient = b.dataset.cl; go('clients'); }); b.addEventListener('keydown', e => { if (e.key === 'Enter') b.click(); }); });
    root.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => openPanel(b.dataset.pay, 'paid')));
    root.querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', () => toast('In the real app this downloads the PDF.')));
    root.querySelectorAll('[data-send]').forEach(b => b.addEventListener('click', () => toast(`Pick a client, then it emails the ${FORMS[b.dataset.send][0].toLowerCase()}.`)));
    root.querySelectorAll('[data-offer]').forEach(b => b.addEventListener('click', () => toast(`Free times emailed to ${b.dataset.offer.split(' ')[0]}`)));
    const u = root.querySelector('[data-open-unpaid]'); if (u) u.addEventListener('click', () => openPanel(sessions.find(s => s.cid === 'c' && s.date === '2026-11-20').id, 'paid'));
    root.querySelectorAll('.chips .chip').forEach(c => c.addEventListener('click', () => toast('Booking opens the same quick sheet as on the phone.')));
  }

  // ── Session panel ──────────────────────────────────────
  let pSid = null;
  function opt(k, ic, t, sub, body, cls = '') { return `<div class="opt ${cls}" data-opt="${k}"><button type="button" class="opt-head" aria-expanded="false"><span class="ic">${ic}</span><span class="txt"><b>${t}</b><span>${sub}</span></span></button><div class="opt-panel" hidden>${body}</div></div>`; }
  function openPanel(sid, focus) {
    const s = sessions.find(x => x.id === sid); if (!s) return; const c = byId(s.cid); pSid = sid;
    document.querySelectorAll('.srow').forEach(r => r.classList.toggle('is-sel', r.dataset.sid === sid));
    $('#p-name').textContent = c.name; $('#p-when').textContent = `${longDay(s.date)}, ${s.time} · ${c.how}`;
    const slots = ['2026-12-08T18:00', '2026-12-11T17:00', '2026-12-15T18:00'];
    $('#p-body').innerHTML = `
      <div class="opt"><button type="button" class="opt-head" data-client><span class="ic">${I.chart}</span><span class="txt"><b>${esc(c.name.split(' ')[0])}&rsquo;s page</b><span>Progress, sessions and payments</span></span></button></div>
      ${opt('reschedule', I.move, 'Reschedule', 'Pick a new free time', `<div class="chips">${slots.map((x, i) => `<button type="button" class="chip" data-slot="${x}" aria-pressed="${i === 0}">${shortDay(x.slice(0, 10))}, ${x.slice(11)}</button>`).join('')}</div><button type="button" class="btn yellow" data-go="reschedule">Move it</button>`)}
      ${opt('forms', I.forms, 'Send forms', 'Intake, agreement, questionnaire', `<label class="check"><input type="checkbox" checked> Intake form</label><label class="check"><input type="checkbox" checked> Therapeutic agreement</label><label class="check"><input type="checkbox"> Values questionnaire</label><button type="button" class="btn yellow" data-go="forms">Email to ${esc(c.name.split(' ')[0])}</button>`)}
      ${opt('paid', I.money, s.paid ? 'Paid' : 'Mark as paid', s.paid ? `Paid by ${s.method}` : `€${c.fee} · no receipt is emailed`, s.paid ? `<button type="button" class="btn" data-go="unpaid">Mark as not paid</button>` : `<div class="seg" id="pay-how"><button type="button" aria-pressed="true">Revolut</button><button type="button" aria-pressed="false">Cash</button><button type="button" aria-pressed="false">Card</button></div><button type="button" class="btn yellow" data-go="paid">Mark €${c.fee} as paid</button>`)}
      ${opt('delete', I.del, 'Delete session', 'Removes it from your diary', `<p class="hint">Delete this session? Their other sessions stay.</p><button type="button" class="btn danger" data-go="delete">Delete this session</button>`, 'is-danger')}`;
    const b = $('#p-body');
    b.querySelector('[data-client]').addEventListener('click', () => { closePanel(); selClient = c.id; go('clients'); });
    b.querySelectorAll('.opt[data-opt] .opt-head').forEach(h => h.addEventListener('click', () => toggle(h.closest('.opt'))));
    b.querySelectorAll('[data-slot]').forEach(ch => ch.addEventListener('click', () => b.querySelectorAll('[data-slot]').forEach(x => x.setAttribute('aria-pressed', String(x === ch)))));
    b.querySelectorAll('#pay-how button').forEach(x => x.addEventListener('click', () => b.querySelectorAll('#pay-how button').forEach(y => y.setAttribute('aria-pressed', String(y === x)))));
    b.querySelectorAll('[data-go]').forEach(x => x.addEventListener('click', () => act(x.dataset.go)));
    if (focus) toggle(b.querySelector(`.opt[data-opt="${focus}"]`), true);
    $('#panel').classList.add('open'); $('#panel').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open');
    setTimeout(() => $('#p-close').focus(), 50);
  }
  function toggle(o, force) {
    const open = force || !o.classList.contains('open');
    document.querySelectorAll('#p-body .opt[data-opt]').forEach(x => { x.classList.remove('open'); x.querySelector('.opt-panel').hidden = true; x.querySelector('.opt-head').setAttribute('aria-expanded', 'false'); });
    if (open) { o.classList.add('open'); o.querySelector('.opt-panel').hidden = false; o.querySelector('.opt-head').setAttribute('aria-expanded', 'true'); }
  }
  function closePanel() { $('#panel').classList.remove('open'); $('#panel').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open'); document.querySelectorAll('.srow.is-sel').forEach(r => r.classList.remove('is-sel')); }
  $('#p-close').addEventListener('click', closePanel); $('#scrim').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  let undoFn = null, tt = null;
  function toast(m, undo) { undoFn = undo || null; $('#t-text').textContent = m; $('#t-undo').hidden = !undo; $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('show'), 5000); }
  $('#t-undo').addEventListener('click', () => { if (undoFn) undoFn(); $('#toast').classList.remove('show'); go(view); });

  function act(k) {
    const s = sessions.find(x => x.id === pSid); const c = byId(s.cid); const first = c.name.split(' ')[0];
    const before = JSON.parse(JSON.stringify(sessions)); const undo = () => { sessions = before; };
    if (k === 'reschedule') { const v = $('#p-body [data-slot][aria-pressed="true"]').dataset.slot; s.date = v.slice(0, 10); s.time = v.slice(11); toast(`Moved: ${first} to ${shortDay(s.date)}, ${s.time}`, undo); }
    if (k === 'forms') toast(`Forms emailed to ${first}`);
    if (k === 'paid') { s.paid = true; s.method = $('#pay-how [aria-pressed="true"]').textContent; toast(`Marked paid (${s.method}): ${first}`, undo); }
    if (k === 'unpaid') { s.paid = false; toast(`Marked not paid: ${first}`, undo); }
    if (k === 'delete') { sessions = sessions.filter(x => x.id !== s.id); toast(`Deleted ${first}'s ${s.time} session`, undo); }
    closePanel(); go(view);
  }

  go('today');
})();
</script>
